<svg width="300" height="260" viewBox="0 0 300 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Task board illustration">
  <defs>
    <linearGradient id="tb-panel" x1="40" y1="30" x2="240" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#EEF0FF" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="tb-plus" x1="210" y1="180" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="tb-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6366F1" flood-opacity="0.22"/>
    </filter>
    <filter id="tb-plus-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- back plate -->
  <rect x="52" y="24" width="206" height="196" rx="20" fill="#E7E9FF" opacity="0.5"/>

  <!-- main glass panel -->
  <g filter="url(#tb-shadow)">
    <rect x="40" y="36" width="206" height="196" rx="20" fill="url(#tb-panel)" stroke="#FFFFFF" stroke-opacity="0.9"/>
  </g>

  <!-- header status tabs -->
  <rect x="58" y="54" width="46" height="12" rx="6" fill="#8B5CF6"/>
  <rect x="112" y="54" width="46" height="12" rx="6" fill="#3B82F6"/>
  <rect x="166" y="54" width="46" height="12" rx="6" fill="#10B981"/>

  <!-- rows -->
  <g>
    <!-- row 1 -->
    <circle cx="66" cy="92" r="5" fill="#8B5CF6"/>
    <rect x="80" y="88" width="78" height="7" rx="3.5" fill="#C7CBF5"/>
    <circle cx="196" cy="92" r="9" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="196" cy="89" r="3" fill="#A78BFA"/><path d="M190 98 c0 -4 3 -6 6 -6 c3 0 6 2 6 6" fill="#A78BFA"/>
    <!-- row 2 -->
    <circle cx="66" cy="116" r="5" fill="#3B82F6"/>
    <rect x="80" y="112" width="92" height="7" rx="3.5" fill="#C7CBF5"/>
    <circle cx="196" cy="116" r="9" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="196" cy="113" r="3" fill="#60A5FA"/><path d="M190 122 c0 -4 3 -6 6 -6 c3 0 6 2 6 6" fill="#60A5FA"/>
    <!-- row 3 -->
    <circle cx="66" cy="140" r="5" fill="#10B981"/>
    <rect x="80" y="136" width="70" height="7" rx="3.5" fill="#C7CBF5"/>
    <circle cx="196" cy="140" r="9" fill="#D1FAE5" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="196" cy="137" r="3" fill="#34D399"/><path d="M190 146 c0 -4 3 -6 6 -6 c3 0 6 2 6 6" fill="#34D399"/>
    <!-- row 4 -->
    <circle cx="66" cy="164" r="5" fill="#F59E0B"/>
    <rect x="80" y="160" width="84" height="7" rx="3.5" fill="#C7CBF5"/>
    <circle cx="196" cy="164" r="9" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="196" cy="161" r="3" fill="#FBBF24"/><path d="M190 170 c0 -4 3 -6 6 -6 c3 0 6 2 6 6" fill="#FBBF24"/>
    <!-- row 5 -->
    <circle cx="66" cy="188" r="5" fill="#F43F5E"/>
    <rect x="80" y="184" width="60" height="7" rx="3.5" fill="#C7CBF5"/>
    <circle cx="196" cy="188" r="9" fill="#FFE4E6" stroke="#FB7185" stroke-width="1.5"/>
    <circle cx="196" cy="185" r="3" fill="#FB7185"/><path d="M190 194 c0 -4 3 -6 6 -6 c3 0 6 2 6 6" fill="#FB7185"/>
  </g>

  <!-- floating add button -->
  <g filter="url(#tb-plus-shadow)">
    <circle cx="236" cy="206" r="22" fill="url(#tb-plus)"/>
    <path d="M236 196 v20 M226 206 h20" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
