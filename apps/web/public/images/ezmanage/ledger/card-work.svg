<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" fill="none" role="img" aria-label="A space with lists, tasks and a progress ring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f1"/>
      <stop offset="1" stop-color="#f8faf9"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a1f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="420" height="150" fill="url(#bg)"/>
  <circle cx="40" cy="140" r="70" fill="#b08d57" opacity="0.08"/>

  <!-- hierarchy: space → lists -->
  <g filter="url(#s)">
    <rect x="24" y="22" width="120" height="30" rx="8" fill="#0b2a1f"/>
    <rect x="34" y="31" width="12" height="12" rx="3" fill="#34d399"/>
    <rect x="54" y="33" width="66" height="7" rx="3.5" fill="#e9efe9" opacity="0.9"/>
  </g>
  <path d="M40 52v74M40 82h14M40 120h14" stroke="#b08d57" stroke-width="1.6" stroke-linecap="round"/>
  <g filter="url(#s)">
    <rect x="56" y="70" width="100" height="24" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
    <rect x="66" y="79" width="56" height="6" rx="3" fill="#065f46"/>
    <rect x="56" y="108" width="100" height="24" rx="7" fill="#ffffff"/>
    <rect x="66" y="117" width="46" height="6" rx="3" fill="#0e1a14" opacity="0.45"/>
  </g>

  <!-- task rows -->
  <g filter="url(#s)">
    <rect x="176" y="22" width="150" height="110" rx="10" fill="#ffffff"/>
  </g>
  <rect x="190" y="38" width="12" height="12" rx="6" fill="#047857"/>
  <path d="M193 44l2 2 4-4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="210" y="41" width="78" height="6" rx="3" fill="#0e1a14" opacity="0.35"/>
  <rect x="190" y="64" width="12" height="12" rx="6" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="210" y="67" width="92" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
  <rect x="190" y="90" width="12" height="12" rx="6" stroke="#b45309" stroke-width="1.6"/>
  <rect x="210" y="93" width="64" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
  <rect x="280" y="91" width="34" height="10" rx="5" fill="#fee2e2"/>
  <rect x="190" y="114" width="12" height="12" rx="6" stroke="#56655d" stroke-width="1.6"/>
  <rect x="210" y="117" width="84" height="6" rx="3" fill="#0e1a14" opacity="0.6"/>

  <!-- progress ring (goal) -->
  <g filter="url(#s)">
    <circle cx="370" cy="76" r="32" fill="#ffffff"/>
  </g>
  <circle cx="370" cy="76" r="24" stroke="#dcefe5" stroke-width="7"/>
  <circle cx="370" cy="76" r="24" stroke="#047857" stroke-width="7" stroke-linecap="round" stroke-dasharray="105 151" transform="rotate(-90 370 76)"/>
  <text x="370" y="81" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="600" fill="#0b2a1f">70%</text>
</svg>
