<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" fill="none" role="img" aria-label="A Kanban board with three columns">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5ef"/>
      <stop offset="1" stop-color="#f6faf8"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a1f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="420" height="150" fill="url(#bg)"/>
  <circle cx="380" cy="18" r="60" fill="#34d399" opacity="0.10"/>

  <!-- column headers -->
  <rect x="28" y="20" width="56" height="10" rx="5" fill="#047857"/>
  <rect x="150" y="20" width="64" height="10" rx="5" fill="#b08d57"/>
  <rect x="272" y="20" width="48" height="10" rx="5" fill="#34d399"/>

  <!-- column 1 -->
  <g filter="url(#s)">
    <rect x="24" y="40" width="112" height="44" rx="9" fill="#ffffff"/>
    <rect x="36" y="52" width="72" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
    <rect x="36" y="64" width="44" height="5" rx="2.5" fill="#56655d" opacity="0.45"/>
    <circle cx="120" cy="70" r="7" fill="#0f766e"/>
    <rect x="24" y="92" width="112" height="44" rx="9" fill="#ffffff"/>
    <rect x="36" y="104" width="60" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
    <rect x="36" y="116" width="52" height="5" rx="2.5" fill="#56655d" opacity="0.45"/>
    <circle cx="120" cy="122" r="7" fill="#9d174d"/>
  </g>
  <!-- column 2 -->
  <g filter="url(#s)">
    <rect x="146" y="40" width="112" height="44" rx="9" fill="#ffffff"/>
    <rect x="158" y="52" width="80" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
    <rect x="158" y="65" width="34" height="9" rx="4.5" fill="#fef3c7"/>
    <circle cx="242" cy="70" r="7" fill="#1d4ed8"/>
    <rect x="146" y="92" width="112" height="44" rx="9" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <rect x="158" y="104" width="66" height="6" rx="3" fill="#0e1a14" opacity="0.75"/>
    <rect x="158" y="117" width="40" height="9" rx="4.5" fill="#dcefe5"/>
    <circle cx="242" cy="122" r="7" fill="#b45309"/>
  </g>
  <!-- column 3 -->
  <g filter="url(#s)">
    <rect x="268" y="40" width="112" height="44" rx="9" fill="#ffffff"/>
    <path d="M281 58l5 5 9-9" stroke="#047857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="55" width="56" height="6" rx="3" fill="#0e1a14" opacity="0.4"/>
    <rect x="281" y="70" width="80" height="4" rx="2" fill="#dcefe5"/>
    <rect x="281" y="70" width="80" height="4" rx="2" fill="#047857"/>
  </g>
  <!-- add button -->
  <g filter="url(#s)">
    <circle cx="390" cy="118" r="16" fill="#047857"/>
    <path d="M390 111v14M383 118h14" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
